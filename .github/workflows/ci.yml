name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: true

      - name: Run formatter
        run: pixi run fmt

      - name: Assert no uncommitted formatting changes
        run: git diff --exit-code

  test:
    name: Test suite (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # One free GitHub-hosted runner per platform in pixi.toml's
        # `platforms` list (linux-64, linux-aarch64, osx-arm64). None of
        # these have a GPU: the accelerator-gated test bodies (`comptime if
        # has_accelerator()`) compile but skip their assertions, and
        # scripts/test.py skips the one file with a real GPU kernel
        # outright (see its docstring) -- this only catches build breaks,
        # not runtime GPU behavior. Run `pixi run test` on a GPU-enabled
        # host to exercise the real logic.
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-14]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: true

      - name: Run tests
        run: pixi run test
