name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: true

      - name: Run formatter
        run: pixi run fmt

      - name: Assert no uncommitted formatting changes
        run: git diff --exit-code

  test:
    name: Test suite (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # One free GitHub-hosted runner per platform in pixi.toml's
        # `platforms` list (linux-64, linux-aarch64, osx-arm64). None of
        # these have a GPU. $MOJO_TEST_SKIP_GPU_TESTS below excludes
        # tests/test_with_gpu_synchronize.mojo (see scripts/test.py's
        # docstring)
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-14]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: true

      - name: Run tests
        env:
          MOJO_TEST_SKIP_GPU_TESTS: "1"
        run: pixi run test
